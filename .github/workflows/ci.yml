name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  library:
    name: Library checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
          cache: true

      - name: Verify dependencies are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -count=1 ./...

  example:
    name: Example checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/unit-of-work
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: examples/unit-of-work/go.sum
          cache: true

      # The example uses gorm.io/driver/sqlite, which is backed by
      # github.com/mattn/go-sqlite3 and requires CGO. The ubuntu-latest image
      # already provides a C toolchain.
      - name: Build example
        run: go build ./...

      - name: Run example
        run: go run .
